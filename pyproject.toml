[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "site-migration-diff"
version = "1.0.0"
description = "Compare crawls before and after a migration and flag what broke"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "site", "migration", "diff"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/site-migration-diff"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
site-migration-diff = "site_migration_diff.cli:main"

[tool.setuptools]
packages = ["site_migration_diff"]
